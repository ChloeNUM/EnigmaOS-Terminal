//skips text if you press a button while its printing
document.addEventListener('keydown', (e) => {
  if (istyping && e.key !== 'Enter') {
    skiptyping = true;
  }
});

//prints out text or DOM nodes slowly :3
async function printline(content) {
  istyping = true;
  skiptyping = false;

  if (content instanceof HTMLElement) {
    const lineElement = document.createElement('p');
    output.appendChild(lineElement);
    lineElement.appendChild(content);
    window.scrollTo(0, document.body.scrollHeight);
    istyping = false;
    return;
  }

  // prints stuff in separate paragraph tags per newline
  const lines = String(content).split('\n');
  for (const thisline of lines) {
    if (!thisline.trim()) continue; 

    const lineElement = document.createElement('p');
    output.appendChild(lineElement);

    for (let i = 0; i < thisline.length; i++) {
      lineElement.textContent += thisline.charAt(i);
      window.scrollTo(0, document.body.scrollHeight);

      if (!skiptyping) { await new Promise(resolve => setTimeout(resolve, 15)) }
    }
  }
  istyping = false;
  skiptyping = false;
}

//lists all items in the current directory with the pretty icons
async function listDirectoryItems() {
  const current = getcwd();
  const children = current.children || {};
  const itemNames = Object.keys(children);

  if (itemNames.length === 0) {
    await printline('> Directory is empty silly!');
    return;
  }

  for (const name of itemNames) {
    const item = children[name];
    
    //creates the container for the icons and file names
    const itemContainer = document.createElement('span');
    itemContainer.style.display = 'flex';
    itemContainer.style.alignItems = 'center';
    itemContainer.style.gap = '8px';

    //adds the pretty icons to the right types of files
    let iconPath = 'images/' + item.icon +' icon.png';

    //create icon image tag
    const icon = document.createElement('img');
    icon.src = iconPath;
    icon.alt = `[${item.type || 'unknown'}]`;
    icon.style.width = '16px';
    icon.style.height = '16px';

    //create text label tag
    const label = document.createElement('span');
    label.textContent = name;

    itemContainer.appendChild(icon);
    itemContainer.appendChild(label);

    await printline(itemContainer);
  }
}

// goes down the directory when you enter a folder
function resolvepath(patharray) {
  if (!patharray || patharray.length === 0) return null;
  let dir = filesystem[patharray[0]];
  if (!dir) return null;

  for (let i = 1; i < patharray.length; i++) {
    if (dir.children && dir.children[patharray[i]] && dir.children[patharray[i]].type === 'dir') {
      dir = dir.children[patharray[i]];
    } else {
      return null;
    }
  }
  return dir;
}

// gets the value of the current working directory
function getcwd() {
  return resolvepath(currentPath);
}

// processes commands
async function processcmd(cmd, arg) {
  const current = getcwd();

  if (cmd === 'read') {
    const file = current.children ? current.children[arg] : null;
    if (file && file.type === 'text'){await printline(`> ${file.content}`);}
    else if (file && file.type === 'image') {
      const imgElement = document.createElement('img')
      const targetFileName = file.file || arg;
      imgElement.src = file.content; //backquotes refused to work??
      imgElement.alt = arg;
      imgElement.style.maxWidth = '300px';
      imgElement.style.maxHeight = '300px';
      imgElement.style.borderRadius = '5px'; 
      imgElement.style.marginTop = '8px';
    await printline(imgElement);
    } else {
    await printline('> ERR: File does not exist or is not readable');
    }
  }
    else if (cmd === 'up') {
    if (currentPath.length > 1) {
      currentPath.pop();
      await printline(`> ${currentPath.join('/')}`);
      await listDirectoryItems();
    } else {
      await printline('> ERR: cannot elevate any further');
    }
  }

  else if (cmd === 'dir') {
    if (!arg) {
      await printline(`> Current directory: /${currentPath.join('/')}`);
      await listDirectoryItems();
      return;
    }
    const cleanArg = arg.startsWith('/') ? arg.slice(1) : arg;
    const constructedPath = `/${currentPath.join('/')}/${cleanArg}`;
    
    // push that shit to goto thats not my job
    await processcmd('goto', constructedPath);
  }
  // GOTO does absolute paths
  else if (cmd === 'goto') {
    if (!arg || !arg.startsWith('/')) {
      await printline(`> ERR: 'goto' requires an absolute path starting with '/'`);
      return;
    }

    const absParts = arg.split('/').filter(p => p.length > 0);
    const targetDir = resolvepath(absParts);

    if (targetDir) {
      currentPath = absParts;
      await listDirectoryItems();
    } else {
      await printline(`> ERR: Directory '${arg}' does not exist`);
    }
  }
  else if (cmd === 'clear') {
    output.innerHTML = '';
  }
  else {
    await printline(`> ERR: Unknown command '${cmd}'`);
  }
};

// waits for you to type
input.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter' && !istyping) {
    const rawInput = input.value.trim();
    if (!rawInput) return;

    //puts the input text onto the screen
    await printline(`> ${rawInput}`);
    input.value = '';

    //splits the input into the command and the argument
    const parts = rawInput.split(' ');
    const cmd = parts[0].toLowerCase();
    const arg = parts[1];

    await processcmd(cmd, arg);
  }
});
